<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="shortcut icon"
      href="https://open.spotifycdn.com/cdn/images/favicon32.b64ecc03.png"
      type="image/x-icon"
    />
    <title>Spotify - Web Player: Music for everyone</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <header>
        <a class="logo" href="#"
          ><img class="invert" src="assets/svg/logo.svg" alt="spotify-logo"
        /></a>
        <a class="home" href="#"
          ><img
            class="invert"
            src="assets/svg/home.svg"
            alt="home-button-image"
        /></a>
        <div class="search">
          <label for="search">
            <img src="assets/svg/search.svg" alt="search-bar-iimage"
          /></label>
          <input
            placeholder="What do you want to play?"
            id="search"
            type="text"
          />
          <a href="#"
            ><img src="assets/svg/browse.svg" alt="browse-songs-image"
          /></a>
        </div>
        <button class="explore-premium">Explore Premium</button>
        <div class="install-app">
          <img
            class="grey"
            src="assets/svg/install.svg"
            alt="install-app=image"
          />
          Install App
        </div>
        <div class="notification">
          <img
            class="grey"
            src="assets/svg/not.svg"
            alt=" notification-image"
          />
        </div>
        <div class="friend-activity">
          <img
            class="grey"
            src="assets/svg/fa.svg"
            alt="friend-activity-image"
          />
        </div>
        <div class="profile">H</div>
      </header>
      <div class="container">
        <section class="left">
          <div class="top">
            <span
              ><img
                height="16"
                width="16"
                src="assets/svg/library.svg"
                alt=""
              />
              <h3>Your Library</h3></span
            >
            <button>
              <img
                height="16"
                width="16"
                src="assets/svg/+.svg"
                alt="add-button"
              />Create
            </button>
          </div>
          <div class="rest">
            <div class="box1">
              <h3>Create your first playlist</h3>
              <h4>It's easy, we'll help you</h4>
              <button>Create playlist</button>
            </div>
            <div class="box2">
              <h3>Let's find some podcasts to follow</h3>
              <h4>We'll keep you updated on new episodes</h4>
              <button>Browse podcasts</button>
            </div>
          </div>
        </section>
        <section class="right">
          <div class="right-top">
            <div class="all-btn white">All</div>
            <div class="music-btn">Music</div>
            <div class="Podcasts-btn">Podcasts</div>
          </div>
          <div class="right-rest">
            <div class="songs-header">
              <h2>Popular albums and singles</h2>
              <p>Show all</p>
            </div>
            <div class="songs-container">
            
            
            
           
              
              
              
              
              
              
              
              
              
              
              
            </div>
          </div>
        </section>
      </div>
    </main>
<section class="player"></section>

    <script src="script.js"></script>
  </body>
</html>
